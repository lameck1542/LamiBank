<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="assets/css/register.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Document</title>
</head>
<body>
	<div class="conteneur">
		<h2>
			Bienvenue sur LamiBank
		</h2>
		
		<form id="register" enctype="multipart/form-data">
			<p>Entrez votre identité pour vous identifie</p>
			
			<label>Nom:</label>
			<input type="text" id="nom" placeholder="Entrez votre nom.." required>
			
			<label>Prenom:</label>
			<input type="text" id="prenom" placeholder="votre prenom.." required>
			
			<label >Photo:</label>
			<input id="photo" type="file">
			
			<button type="submit" class="entrer" id="entrer">
				Entrez
			</button>
		</form>
	</div>
<script src="cordova.js"></script>
<script src="js/base_de_donnees.js"></script>
<script src="js/register.js"></script>
</body>
</html>
